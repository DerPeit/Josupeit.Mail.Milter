name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  ci:
    runs-on: codeberg-medium-lazy
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0
    env:
      # Everything here targets net8.0 and the SDK image carries only the 10.0 runtime, so the test
      # host finds no 8.0.x to start on. Rolling forward is the way out that keeps the modern SDK -
      # pinning the image to 8.0 instead would lose .slnx and the language version the code is on.
      DOTNET_ROLL_FORWARD: Major
    steps:
      # actions/checkout is not available on Codeberg's runners, so the clone is by hand. It has to
      # stay a *full* clone: Nerdbank.GitVersioning derives the version from the commit height, and a
      # shallow one produces a wrong version, or none at all.
      - name: Checkout
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git clone "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" .
          git checkout "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"

      # First, because it needs nothing but a shell and fails in seconds: a public API change that
      # llms-full.txt does not mention, or a link into the tree that no longer resolves, stops the run
      # before the build is paid for. See CLAUDE.md, "LLM documentation".
      - name: Check LLM documentation
        run: bash scripts/check-llms-docs.sh

      - name: Restore local tools
        run: dotnet tool restore

      # -warnaserror here rather than TreatWarningsAsErrors in Directory.Build.props: the analyzers are
      # a gate on what lands, not on what a working tree compiles, so a half-finished local edit still
      # builds while an unaddressed warning never reaches a branch.
      - name: Build
        run: dotnet build --configuration Release -warnaserror

      # The unit tests only. Josupeit.Mail.Milter.IntegrationTests drives a real Postfix through
      # Testcontainers and needs a Docker daemon of its own, which the shared runners do not hand out -
      # so that half of the suite is run locally before pushing rather than here. See CONTRIBUTING.md.
      - name: Unit tests
        run: dotnet test test/Josupeit.Mail.Milter.UnitTests --configuration Release --no-build

      # The project, not the solution: a solution-wide pack sweeps up everything packable, and
      # "packages/*.nupkg" in the next step would then push it - the sample and the generator
      # included, neither of which is a package anyone should be able to install.
      #
      # And no --no-build. Packing the library resolves its analyzer ProjectReference to the generator,
      # which invokes that project's Build target, which is precisely what --no-build forbids (NETSDK1085).
      # The build is deterministic and the inputs are unchanged, so repeating it costs seconds and buys
      # a pack that matches the one CONTRIBUTING and CLAUDE.md tell you to run by hand.
      - name: Pack
        if: github.ref == 'refs/heads/main'
        run: dotnet pack src/Josupeit.Mail.Milter --configuration Release --output packages

      - name: Push to NuGet
        if: github.ref == 'refs/heads/main'
        run: >-
          dotnet nuget push "packages/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --skip-duplicate

  aot:
    runs-on: codeberg-medium-lazy
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0
    steps:
      - name: Checkout
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git clone "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" .
          git checkout "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"

      - name: Install Native AOT prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends clang zlib1g-dev
          rm -rf /var/lib/apt/lists/*

      - name: Restore local tools
        run: dotnet tool restore

      - name: Publish AOT smoke test
        run: >-
          dotnet publish aot/Josupeit.Mail.Milter.AotSmoke/Josupeit.Mail.Milter.AotSmoke.csproj
          --configuration Release --runtime linux-x64

      - name: Run AOT smoke test
        run: |
          binary="aot/Josupeit.Mail.Milter.AotSmoke/bin/Release/net10.0/linux-x64/publish/Josupeit.Mail.Milter.AotSmoke"
          output="$("$binary")"
          echo "$output"
          echo "$output" | grep -q "AOT SMOKE OK"
