name: Context7

# Context7 indexes main - context7.json pins "branch": "main", because development is the default branch
# here and its documentation may describe what has not been released yet. So the index only needs a
# refresh when main moves, which is a pushed release merge; a pull request into development leaves it
# untouched.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  refresh:
    runs-on: codeberg-medium-lazy
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0
    steps:
      - name: Refresh Context7 library
        run: >-
          curl --silent --show-error --fail-with-body -X POST https://context7.com/api/v1/refresh
          -H "Content-Type: application/json"
          -H "Authorization: Bearer ${{ secrets.CONTEXT7_API_KEY }}"
          -d '{"libraryName": "/git_codeberg_org/derpeit_josupeit.mail.milter"}'
